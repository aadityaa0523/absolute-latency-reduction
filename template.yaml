AWSTemplateFormatVersion: '2010-09-09'
Description: Absolute Latency Reduction - streaming Bedrock relay (Lambda function URL) with a DynamoDB response cache. Deploy once per region being compared.

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket in this region that holds the packaged relay zip
  CodeKey:
    Type: String
    Description: S3 key of the relay zip built by scripts/package.js
  ReservedConcurrency:
    Type: Number
    Default: -1
    MinValue: -1
    Description: Cost brake for the public URL. -1 means none. New accounts often have a total limit of 10, which leaves nothing to reserve, so the account limit is then the cap.

Conditions:
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, -1]]

Resources:
  CacheTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  RelayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/alr-relay-${AWS::Region}
      RetentionInDays: 14

  RelayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: relay
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt RelayLogGroup.Arn
              - Sid: Cache
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt CacheTable.Arn
              - Sid: Models
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*

  RelayFunction:
    Type: AWS::Lambda::Function
    DependsOn: RelayLogGroup
    Properties:
      FunctionName: !Sub alr-relay-${AWS::Region}
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: relay/handler.handler
      MemorySize: 512
      Timeout: 60
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref 'AWS::NoValue']
      Role: !GetAtt RelayRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          CACHE_TABLE: !Ref CacheTable

  RelayUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt RelayFunction.Arn
      AuthType: NONE
      InvokeMode: RESPONSE_STREAM
      Cors:
        AllowOrigins: ['*']
        AllowMethods: [GET, POST]
        AllowHeaders: [content-type]
        MaxAge: 3600

  UrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RelayFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  UrlInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RelayFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

Outputs:
  RelayUrl:
    Description: Public streaming endpoint for this region
    Value: !GetAtt RelayUrl.FunctionUrl
  CacheTableName:
    Value: !Ref CacheTable
